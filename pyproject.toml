[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "erag-teaching-assistant"
version = "2.2.0"
description = "Thesis-aligned one-model ERAG teaching assistant"
requires-python = ">=3.11"
dependencies = ["openai>=1.70,<2", "httpx>=0.28,<1", "numpy>=1.26,<3", "pydantic>=2.10,<3", "pydantic-settings>=2.8,<3", "gradio>=6.17,<7", "pypdf>=6,<7", "filelock>=3.16,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
# aioprometheus in Xinference 1.x requires the pre-0.137 flattened FastAPI routes.
local = ["xinference>=1.7,<2", "fastapi>=0.115.2,<0.137", "transformers>=4.51,<4.54", "sentence-transformers>=5,<6", "sentencepiece>=0.2,<1", "accelerate>=1.6,<2"]
resources = ["huggingface-hub>=0.30,<3"]
benchmark = ["pyarrow>=18,<27"]
all = ["erag-teaching-assistant[dev,local,resources,benchmark]"]

[project.scripts]
erag = "erag.cli:main"
erag-ui = "erag.web.ui:main"
erag-download = "erag.resources:main"
erag-server = "erag.services.start_xinference:main"
erag-models = "erag.services.launch_local_models:main"
erag-check = "erag.services.check_models:main"

[tool.setuptools.packages.find]
include = ["erag*"]

[tool.setuptools.package-data]
erag = ["resource-manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
